# =====================================
# ?? Project-wide Gradle Configuration
# =====================================

# ? Ajuste de memoria para el proceso Gradle (evita crashes del daemon)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# ? Ajuste de memoria adicional para el compilador Kotlin
kotlin.daemon.jvmargs=-Xmx2048m

# ?? Activa AndroidX y Jetifier
android.useAndroidX=true
android.enableJetifier=true

# ? Estilo de código de Kotlin
kotlin.code.style=official

# ? Optimiza las clases R (reduce tamaño del build)
android.nonTransitiveRClass=true
